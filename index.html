<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Timing Guide - Animated Video Presentation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Noto+Sans+Ethiopic:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans Ethiopic', sans-serif;
            background: #0f172a;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-center;
            overflow: hidden;
            margin: 0;
        }

        /* Mobile Reels / TikTok Aspect Ratio Container */
        .video-container {
            width: 100%;
            max-width: 420px;
            height: 92vh;
            max-height: 860px;
            background: #ffffff;
            border-radius: 36px;
            position: relative;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 40px rgba(16, 185, 129, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #1e293b;
        }

        /* Animated Drawing Stroke for Marks */
        .stroke-draw {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: strokeAnim 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        @keyframes strokeAnim {
            to { stroke-dashoffset: 0; }
        }

        /* Kinetic Pop and Slide Animations */
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.4) rotate(-5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(35px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .float-gentle {
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        /* Scene transition out */
        .scene-exit {
            animation: sceneExit 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards !important;
        }

        @keyframes sceneExit {
            0% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
            100% { opacity: 0; transform: scale(0.92) translateY(-20px); filter: blur(6px); }
        }

        /* Glowing accents */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <!-- Ambient Outer Background Effects -->
    <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black -z-10"></div>

    <div class="video-container mx-auto my-auto">
        
        <!-- Ambient Internal Glow -->
        <div class="ambient-glow"></div>

        <!-- Top Header & Story Progress Bars -->
        <div class="p-4 pt-5 z-20 space-y-3 bg-gradient-to-b from-white via-white/90 to-transparent">
            <!-- Progress Bar Segments (One per food item) -->
            <div id="progress-container" class="flex gap-1.5 h-1.5 w-full">
                <!-- Dynamically filled with javascript -->
            </div>

            <!-- Top Title Info -->
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs font-bold shadow-md shadow-emerald-500/30">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <div>
                        <h1 class="text-xs font-extrabold text-slate-800 tracking-tight leading-none">NUTRITION TIMING</h1>
                        <p class="text-[10px] font-bold text-emerald-600">የምግብ ሰዓቶች መመሪያ</p>
                    </div>
                </div>
                <div class="flex items-center gap-1.5 bg-slate-100 px-2.5 py-1 rounded-full text-[10px] font-extrabold text-slate-600 border border-slate-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    AUTOPLAY
                </div>
            </div>
        </div>

        <!-- Main Animated Content Stage -->
        <div id="scene-stage" class="flex-1 flex flex-col justify-between px-6 pt-2 pb-6 z-10 relative">
            <!-- Scene content gets injected here continuously -->
        </div>

        <!-- Video Bottom Branding Footer -->
        <div class="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 font-semibold z-20">
            <span class="flex items-center gap-1.5 text-slate-700 font-bold">
                <i class="fa-solid fa-user-doctor text-emerald-600"></i>
                Prepared by <span class="text-emerald-700 font-extrabold">Dr. Solomon Abebe (MD, MPH/RH)</span>
            </span>
            <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Live Presentation</span>
        </div>

    </div>

    <script>
        // Data containing all presentation scenes (matching video source)
        const scenesData = [
            {
                id: 'eggs',
                titleEn: 'Eggs',
                titleAm: 'እንቁላል',
                badge: 'Protein',
                colorTheme: 'amber',
                svgIcon: `<svg viewBox="0 0 120 120" class="w-28 h-28 float-gentle drop-shadow-xl">
                    <ellipse cx="60" cy="70" rx="42" ry="32" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
                    <ellipse cx="60" cy="65" rx="38" ry="28" fill="#FEF3C7"/>
                    <!-- Eggs in basket -->
                    <ellipse cx="45" cy="55" rx="14" ry="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
                    <ellipse cx="75" cy="55" rx="14" ry="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
                    <ellipse cx="60" cy="48" rx="15" ry="20" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
                </svg>`,
                tips: [
                    {
                        isDo: true,
                        timeIcon: 'fa-sun text-amber-500',
                        en: 'Best in the morning',
                        am: 'ጠዋት መመገብ ይመረጣል'
                    },
                    {
                        isDo: false,
                        timeIcon: 'fa-moon text-indigo-400',
                        en: 'Not at night',
                        am: 'ማታ አይመከርም'
                    }
                ]
            },
            {
                id: 'fruits',
                titleEn: 'Fruits',
                titleAm: 'ፍራፍሬዎች',
                badge: 'Vitamins',
                colorTheme: 'rose',
                svgIcon: `<svg viewBox="0 0 120 120" class="w-28 h-28 float-gentle drop-shadow-xl">
                    <circle cx="48" cy="65" r="26" fill="#EF4444"/>
                    <circle cx="75" cy="70" r="20" fill="#F59E0B"/>
                    <circle cx="38" cy="70" r="14" fill="#10B981"/>
                    <path d="M 48 39 C 48 30 60 24 62 22" fill="none" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 62 26 Q 74 24 70 34 Z" fill="#22C55E"/>
                </svg>`,
                tips: [
                    {
                        isDo: false,
                        timeIcon: 'fa-utensils text-slate-400',
                        en: 'Not after every meal',
                        am: 'ከእያንዳንዱ ምግብ በኋላ አይመከርም'
                    },
                    {
                        isDo: true,
                        timeIcon: 'fa-bolt text-emerald-500',
                        en: 'Best on an empty stomach',
                        am: 'ባዶ ሆድ ላይ መመገብ ይመረጣል'
                    }
                ]
            },
            {
                id: 'tea',
                titleEn: 'Tea',
                titleAm: 'ሻይ',
                badge: 'Antioxidants',
                colorTheme: 'emerald',
                svgIcon: `<svg viewBox="0 0 120 120" class="w-28 h-28 float-gentle drop-shadow-xl">
                    <rect x="30" y="45" width="55" height="42" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
                    <path d="M 85 55 C 98 55 98 72 85 72" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
                    <path d="M 36 45 L 79 45 L 74 82 L 41 82 Z" fill="#B45309" opacity="0.85"/>
                    <path d="M 42 28 Q 48 20 46 14 M 58 30 Q 64 22 62 16 M 72 28 Q 78 20 76 14" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none"/>
                </svg>`,
                tips: [
                    {
                        isDo: false,
                        timeIcon: 'fa-ban text-rose-400',
                        en: 'Not right after eating',
                        am: 'ከምግብ በኋላ ወዲያውኑ መጠጣት አይመከርም'
                    },
                    {
                        isDo: true,
                        timeIcon: 'fa-leaf text-emerald-500',
                        en: 'Best on an empty stomach',
                        am: 'ባዶ ሆድ ላይ መጠጣት ይመረጣል'
                    }
                ]
            },
            {
                id: 'water',
                titleEn: 'Water',
                titleAm: 'ውሃ',
                badge: 'Hydration',
                colorTheme: 'sky',
                svgIcon: `<svg viewBox="0 0 120 120" class="w-28 h-28 float-gentle drop-shadow-xl">
                    <path d="M 35 28 L 85 28 L 76 98 L 44 98 Z" fill="#E0F2FE" stroke="#38BDF8" stroke-width="3"/>
                    <path d="M 38 45 L 82 45 L 76 98 L 44 98 Z" fill="#38BDF8" opacity="0.65"/>
                    <path d="M 38 45 Q 60 50 82 45" fill="none" stroke="#0284C7" stroke-width="3"/>
                </svg>`,
                tips: [
                    {
                        isDo: true,
                        timeIcon: 'fa-clock text-sky-500',
                        en: 'Drink 30 mins after a meal',
                        am: 'ከምግብ በኋላ ከ30 ደቂቃ በኋላ መጠጣት ይመረጣል'
                    },
                    {
                        isDo: false,
                        timeIcon: 'fa-hand-stop text-rose-400',
                        en: 'Not right before eating',
                        am: 'ከምግብ በፊት ወዲያውኑ መጠጣት አይመከርም'
                    }
                ]
            },
            {
                id: 'banana',
                titleEn: 'Banana',
                titleAm: 'ሙዝ',
                badge: 'Energy',
                colorTheme: 'amber',
                svgIcon: `<svg viewBox="0 0 120 120" class="w-28 h-28 float-gentle drop-shadow-xl">
                    <path d="M 30 35 C 50 28 88 40 92 85 C 72 80 48 68 30 35 Z" fill="#FACC15" stroke="#EAB308" stroke-width="3"/>
                    <path d="M 30 35 Q 24 28 26 22" fill="none" stroke="#854D0E" stroke-width="5" stroke-linecap="round"/>
                </svg>`,
                tips: [
                    {
                        isDo: false,
                        timeIcon: 'fa-moon text-indigo-400',
                        en: 'Not at night before bed',
                        am: 'ማታ ከመተኛት በፊት አይመከርም'
                    },
                    {
                        isDo: true,
                        timeIcon: 'fa-dumbbell text-amber-500',
                        en: 'Best at noon or before a workout',
                        am: 'ቀትር ላይ ወይም ከስፖርት በፊት ይመረጣል'
                    }
                ]
            },
            {
                id: 'milk',
                titleEn: 'Milk',
                titleAm: 'ወተት',
                badge: 'Calcium',
                colorTheme: 'indigo',
                svgIcon: `<svg viewBox="0 0 120 120" class="w-28 h-28 float-gentle drop-shadow-xl">
                    <path d="M 40 22 L 80 22 L 86 40 L 86 98 L 34 98 L 34 40 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
                    <path d="M 40 22 L 80 22 L 80 32 L 40 32 Z" fill="#64748B"/>
                    <rect x="46" y="52" width="28" height="28" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
                    <circle cx="60" cy="66" r="6" fill="#38BDF8" opacity="0.4"/>
                </svg>`,
                tips: [
                    {
                        isDo: true,
                        timeIcon: 'fa-bed text-indigo-500',
                        en: 'Best at night before bed',
                        am: 'ማታ ከመተኛት በፊት መጠጣት ይመረጣል'
                    },
                    {
                        isDo: false,
                        timeIcon: 'fa-sun text-amber-500',
                        en: 'Not in morning on empty stomach',
                        am: 'ጠዋት ባዶ ሆድ ላይ አይመከርም'
                    }
                ]
            }
        ];

        // Player Engine Variables
        let currentSceneIndex = 0;
        const SCENE_DURATION = 5500; // 5.5 seconds per scene
        let sceneTimer = null;

        // Initialize presentation
        window.onload = function() {
            buildProgressBars();
            playScene(0);
        };

        function buildProgressBars() {
            const container = document.getElementById('progress-container');
            container.innerHTML = '';
            
            scenesData.forEach((_, idx) => {
                const barBg = document.createElement('div');
                barBg.className = 'flex-1 bg-slate-200 rounded-full overflow-hidden h-full';
                
                const barFill = document.createElement('div');
                barFill.id = `progress-fill-${idx}`;
                barFill.className = 'h-full bg-emerald-500 w-0 transition-all duration-100 ease-linear';
                
                barBg.appendChild(barFill);
                container.appendChild(barBg);
            });
        }

        function playScene(index) {
            currentSceneIndex = index;
            const scene = scenesData[index];
            const stage = document.getElementById('scene-stage');

            // Reset scene stage
            stage.className = "flex-1 flex flex-col justify-between px-6 pt-2 pb-6 z-10 relative";
            
            // Render HTML for scene with kinetic entrance elements
            stage.innerHTML = `
                <!-- Main Header Title & Visual Illustration -->
                <div class="flex flex-col items-center text-center mt-2">
                    <!-- Category Badge -->
                    <span class="pop-in px-3.5 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-wider bg-slate-100 text-slate-700 border border-slate-200 shadow-sm mb-3">
                        ${scene.badge}
                    </span>

                    <!-- Title in English & Amharic -->
                    <h2 class="slide-up text-3xl font-black text-slate-900 tracking-tight leading-none mb-1">
                        ${scene.titleEn}
                    </h2>
                    <h3 class="slide-up text-xl font-extrabold text-emerald-600 mb-4" style="animation-delay: 0.1s">
                        ${scene.titleAm}
                    </h3>

                    <!-- SVG Illustration -->
                    <div class="pop-in my-2" style="animation-delay: 0.15s">
                        ${scene.svgIcon}
                    </div>
                </div>

                <!-- Tips List Container -->
                <div class="space-y-4 my-auto">
                    ${scene.tips.map((tip, tIdx) => `
                        <div class="slide-up bg-white rounded-2xl p-4 border border-slate-100 shadow-md shadow-slate-200/50 flex items-center justify-between gap-3 relative overflow-hidden" 
                             style="animation-delay: ${0.35 + (tIdx * 0.4)}s">
                            
                            <!-- Left Color Bar Indicator -->
                            <div class="absolute left-0 top-0 bottom-0 w-2 ${tip.isDo ? 'bg-emerald-500' : 'bg-rose-500'}"></div>

                            <!-- Text Content (English & Amharic Stacked) -->
                            <div class="pl-2 flex-1 text-left">
                                <div class="flex items-center gap-1.5 text-xs font-black uppercase tracking-wider ${tip.isDo ? 'text-emerald-700' : 'text-rose-700'} mb-0.5">
                                    <i class="fa-solid ${tip.timeIcon}"></i>
                                    <span>${tip.isDo ? 'RECOMMENDED / ይመረጣል' : 'AVOID / አይመከርም'}</span>
                                </div>
                                <p class="text-sm font-extrabold text-slate-800 leading-snug">
                                    ${tip.am}
                                </p>
                                <p class="text-xs font-semibold text-slate-500">
                                    ${tip.en}
                                </p>
                            </div>

                            <!-- Animated Hand-drawn Check / Cross Icon -->
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${tip.isDo ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                                ${tip.isDo ? `
                                    <svg viewBox="0 0 50 50" class="w-8 h-8">
                                        <path class="stroke-draw" d="M 12 26 L 22 36 L 38 14" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                ` : `
                                    <svg viewBox="0 0 50 50" class="w-8 h-8">
                                        <path class="stroke-draw" d="M 15 15 L 35 35 M 35 15 L 15 35" fill="none" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>
                                    </svg>
                                `}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Update progress bars
            scenesData.forEach((_, idx) => {
                const fill = document.getElementById(`progress-fill-${idx}`);
                if (idx < index) {
                    fill.style.transition = 'none';
                    fill.style.width = '100%';
                } else if (idx === index) {
                    fill.style.transition = 'none';
                    fill.style.width = '0%';
                    // Trigger smooth progress fill
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            fill.style.transition = `width ${SCENE_DURATION}ms linear`;
                            fill.style.width = '100%';
                        });
                    });
                } else {
                    fill.style.transition = 'none';
                    fill.style.width = '0%';
                }
            });

            // Schedule Next Scene Transition
            clearTimeout(sceneTimer);
            sceneTimer = setTimeout(() => {
                // Exit current scene with blur/slide effect
                stage.classList.add('scene-exit');
                
                setTimeout(() => {
                    const nextIndex = (currentSceneIndex + 1) % scenesData.length;
                    playScene(nextIndex);
                }, 450); // Match exit animation speed

            }, SCENE_DURATION);
        }
    </script>
</body>
</html>
